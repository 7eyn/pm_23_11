<!-- Top Header / About & Name Banner -->
<header class="resume-top-banner">
  <div class="row g-0 align-items-start">
    <!-- Left Column: ABOUT ME -->
    <div class="col-lg-7 resume-about-box">
      <div class="section-heading d-flex align-items-center mb-3">
        <span class="icon-circle icon-circle--dark me-3" aria-hidden="true">
          <i class="bi bi-person-fill"></i>
        </span>
        <h2 class="section-title mb-0 text-uppercase fw-bold">About Me</h2>
      </div>
      <p id="personSummary" class="about-text mb-0"></p>
    </div>

    <!-- Right Column: Name & Job Title -->
    <div
      class="col-lg-5 resume-name-box text-center d-flex flex-column justify-content-start align-items-center"
    >
      <h1
        id="personName"
        class="candidate-name text-uppercase fw-bolder mb-1"
      ></h1>
      <p class="candidate-role text-uppercase mb-0">
        Graphic &amp; Web Designer
      </p>
    </div>
  </div>
</header>
