<!-- Left White Content Area: Job Experience, Skills, Language, Hobbies -->
<div class="col-lg-7 resume-left-col">
  <!-- JOB EXPERIENCE -->
  <section class="resume-section mb-4 pb-1">
    <div class="section-heading d-flex align-items-center mb-3">
      <span class="icon-circle icon-circle--dark me-3" aria-hidden="true">
        <i class="bi bi-briefcase-fill"></i>
      </span>
      <h2 class="section-title mb-0 text-uppercase fw-bold">Job Experience</h2>
      <button
        class="section-toggle ms-auto"
        type="button"
        data-target="jobsContent"
        aria-expanded="true"
        aria-controls="jobsContent"
        aria-label="Toggle job experience"
      >
        <span class="toggle-arrow" aria-hidden="true">▼</span>
      </button>
    </div>

    <div id="jobsContent" class="collapsible-content">
      <div id="jobsList"></div>
    </div>
  </section>

  <!-- SKILLS -->
  <section class="resume-section mb-4 pb-2">
    <div class="section-heading d-flex align-items-center mb-3">
      <span class="icon-circle icon-circle--dark me-3" aria-hidden="true">
        <i class="bi bi-pie-chart-fill"></i>
      </span>
      <h2 class="section-title mb-0 text-uppercase fw-bold">Skills</h2>
      <button
        class="section-toggle ms-auto"
        type="button"
        data-target="skillsContent"
        aria-expanded="true"
        aria-controls="skillsContent"
        aria-label="Toggle skills"
      >
        <span class="toggle-arrow" aria-hidden="true">▼</span>
      </button>
    </div>

    <div
      id="skillsContent"
      class="row g-3 skills-grid collapsible-content"
    ></div>
  </section>

  <!-- LANGUAGE & HOBBIES -->
  <div class="row g-4 pt-1">
    <!-- LANGUAGE -->
    <div class="col-sm-6">
      <section class="resume-section">
        <div class="section-heading d-flex align-items-center mb-3">
          <span class="icon-circle icon-circle--dark me-3" aria-hidden="true">
            <i class="bi bi-globe2"></i>
          </span>
          <h2 class="section-title mb-0 text-uppercase fw-bold">Language</h2>
        </div>
        <div class="row g-2 language-list">
          <div class="col-6">
            <div class="bullet-item text-uppercase fw-bold">English</div>
          </div>
          <div class="col-6">
            <div class="bullet-item text-uppercase fw-bold">Spanish</div>
          </div>
          <div class="col-6">
            <div class="bullet-item text-uppercase fw-bold">French</div>
          </div>
          <div class="col-6">
            <div class="bullet-item text-uppercase fw-bold">German</div>
          </div>
        </div>
      </section>
    </div>

    <!-- HOBBIES -->
    <div class="col-sm-6">
      <section class="resume-section">
        <div class="section-heading d-flex align-items-center mb-3">
          <span class="icon-circle icon-circle--dark me-3" aria-hidden="true">
            <i class="bi bi-flag-fill"></i>
          </span>
          <h2 class="section-title mb-0 text-uppercase fw-bold">Hobbies</h2>
        </div>
        <ul class="list-unstyled mb-0 hobbies-list">
          <li class="bullet-item text-uppercase fw-bold mb-2">Reading Books</li>
          <li class="bullet-item text-uppercase fw-bold mb-2">Traveling</li>
          <li class="bullet-item text-uppercase fw-bold">Playing Chess</li>
        </ul>
      </section>
    </div>
  </div>
</div>
